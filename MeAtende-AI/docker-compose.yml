services:
  meatende:
    build: .
    container_name: meatende-ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_DIR: /app/public
      DATABASE_URL: file:/data/meatende.db
      COOKIE_SECURE: "false"
    volumes:
      - meatende-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  meatende-data:
