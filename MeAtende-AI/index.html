<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MeAtende AI — Atendente com IA para WhatsApp</title>
  <meta name="description" content="MeAtende AI: a atendente com inteligência artificial que responde, agenda e vende pelo WhatsApp da sua empresa, 24 horas por dia.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preload" href="assets/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/theme.css">
  <script>
    /* Aplica o tema salvo antes da pintura, evitando flash */
    try { document.documentElement.setAttribute('data-theme', localStorage.getItem('meatende.theme') === 'dark' ? 'dark' : 'light'); } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navegação principal"></aside>
    <div class="scrim" id="scrim"></div>
    <div class="main-wrap">
      <header class="topbar" id="topbar"></header>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
  </div>
  <noscript>
    <div style="padding:40px;font-family:sans-serif;text-align:center">
      <h1>MeAtende AI</h1>
      <p>Ative o JavaScript para usar o sistema.</p>
    </div>
  </noscript>
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
